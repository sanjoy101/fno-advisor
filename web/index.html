    </>;
  };
  const directoryRows = rows.filter((r) => r.symbol.toLowerCase().includes(symbolQuery.trim().toLowerCase()));

  return (
    <section id="overview" className="scroll-mt-36 space-y-4" aria-label="Market overview and scanner">
      <div className="flex flex-wrap items-end justify-between gap-3"><div><div className="text-xs uppercase tracking-[.2em] text-sky-300 font-bold">Observed market</div><h2 className="mt-1 text-2xl font-black">Market X-Ray</h2><p className="text-sm text-slate-400">Completed candles · descriptive breadth, not a prediction</p></div>
        {market && <div className="text-right text-xs text-slate-500">{marketActive ? `${market.coverage.fresh}/${market.coverage.subscribed} symbols current` : `${observations.length}/${market.coverage.subscribed} symbols with prior-session bars`} · as of {hhmmss(market.asof)}</div>}</div>
      {unavailable ? <div role="status" className="rounded-xl desk-card ring-1 p-5 text-slate-400">Waiting for the first market snapshot. Coverage is limited to symbols subscribed in this session.</div> : <>
        {!marketActive && <div role="status" className="rounded-xl border border-amber-500/25 bg-amber-500/[.06] px-4 py-3 text-sm text-amber-100">Market closed · showing the last available session as historical context. Live readings resume during NSE market hours.</div>}
        <div className="grid grid-cols-2 lg:grid-cols-5 gap-3">
          <div className="rounded-xl desk-card ring-1 ring-slate-700 p-4"><div className="text-xs uppercase tracking-widest text-slate-400">{marketActive ? "Up from first bar" : "Last session · up"}</div><div className="mt-1 text-3xl font-black text-emerald-300 tabnum">{marketActive ? market.breadth.up_from_baseline : up.length}</div></div>
          <div className="rounded-xl desk-card ring-1 ring-slate-700 p-4"><div className="text-xs uppercase tracking-widest text-slate-400">{marketActive ? "Down from first bar" : "Last session · down"}</div><div className="mt-1 text-3xl font-black text-rose-300 tabnum">{marketActive ? market.breadth.down_from_baseline : down.length}</div></div>
          <div className="rounded-xl desk-card ring-1 ring-slate-700 p-4"><div className="text-xs uppercase tracking-widest text-slate-400">{marketActive ? "At first-bar baseline" : "Last session · flat"}</div><div className="mt-1 text-3xl font-black text-slate-200 tabnum">{marketActive ? market.breadth.at_baseline : flat.length}</div></div>
          <div className="rounded-xl desk-card ring-1 ring-slate-700 p-4"><div className="text-xs uppercase tracking-widest text-slate-400">{marketActive ? "Stale / no bars" : "Prior-session bars"}</div><div className="mt-1 text-3xl font-black text-amber-200 tabnum">{marketActive ? `${market.coverage.stale} / ${market.coverage.without_bars}` : `${observations.length} / ${market.coverage.subscribed}`}</div></div>
          <div className="col-span-2 lg:col-span-1 rounded-xl border border-slate-700 bg-slate-950/60 p-4"><div className="text-xs uppercase tracking-widest text-slate-400">Index context</div>{indexRows.length ? indexRows.map((r) => <div key={r.symbol} className="mt-2 flex items-center justify-between gap-2"><div><div className="text-xs font-bold text-slate-400">{r.symbol}</div><div className="tabnum font-black text-slate-100">{r.last_price == null ? "—" : `₹${num(r.last_price)}`}</div></div><span className={`tabnum text-sm font-bold ${r.stale && marketActive ? "text-amber-300" : Number(r.change_from_baseline_pct) >= 0 ? "text-emerald-300" : "text-rose-300"}`}>{r.stale && marketActive ? "STALE" : r.change_from_baseline_pct == null ? (marketActive ? "NO BARS" : "NO DATA") : `${signed(r.change_from_baseline_pct)}%`}</span></div>) : <div className="mt-2 font-bold text-slate-300">NIFTY · BANK NIFTY</div>}<div className="mt-1 text-xs text-slate-500">{indexRows.length ? (marketActive ? "Index prices from first available bar" : "Previous-session index context") : "Not subscribed to this feed"}</div></div>
        </div>
        {marketActive && (market.coverage.stale > 0 || market.coverage.without_bars > 0) && <div role="status" className="rounded-lg border border-amber-700/60 bg-amber-950/30 px-4 py-3 text-sm text-amber-100">Some symbols have stale data or no completed bars. They are excluded from current breadth.</div>}
        <div id="scanner" className="grid gap-4 lg:grid-cols-2 scroll-mt-36">
          <Panel title={marketActive ? "Observed up from first available bar" : "Up during the last session"}><p className="mb-2 text-xs text-slate-500">Alphabetical · completed-bar movement · descriptive only</p><SymbolRows items={up} tone="text-emerald-300" showAll={showAllUp} onToggle={() => setShowAllUp(!showAllUp)}/></Panel>
          <Panel title={marketActive ? "Observed down from first available bar" : "Down during the last session"}><p className="mb-2 text-xs text-slate-500">Alphabetical · completed-bar movement · descriptive only</p><SymbolRows items={down} tone="text-rose-300" showAll={showAllDown} onToggle={() => setShowAllDown(!showAllDown)}/></Panel>
        </div>
        <Panel title="Sector breadth"><p className="mb-3 text-xs text-slate-500">{market.sectors_are_historical ? "Counts from the last available completed session; historical context." : "Counts among current fresh symbols in the subscribed set."} Unknown sector mappings remain visible.</p><div className="grid gap-2 sm:grid-cols-2 xl:grid-cols-4">{(market.sectors || []).map((s) => <div key={s.sector} className="flex items-center justify-between rounded-lg bg-slate-950/60 px-3 py-2 text-sm"><span className="font-semibold text-slate-300">{s.sector}</span><span className="tabnum"><b className="text-emerald-300">{s.up}↑</b><span className="mx-2 text-slate-600">/</span><b className="text-rose-300">{s.down}↓</b><span className="ml-2 text-slate-500">{s.flat} flat</span></span></div>)}</div></Panel>
        {selected && <div id="charts" className="scroll-mt-36"><div className="mb-2 flex items-center justify-between"><div><h2 className="text-xl font-black">Structure workspace</h2><p className="text-xs text-slate-500">Candles, mechanical zones, and confirmed swing levels</p></div><span className="rounded-full bg-sky-400/10 px-3 py-1 text-xs font-bold text-sky-200">{selected}</span></div><MarketChart symbol={selected}/></div>}
        <Panel title={`F&O symbol directory · ${rows.length}`}><div className="flex flex-wrap items-end justify-between gap-3"><p className="text-sm text-slate-400">Find a subscribed instrument and open its chart. Symbols are alphabetical.</p><div className="flex gap-2"><input aria-label="Search F&O symbols" value={symbolQuery} onChange={(e) => setSymbolQuery(e.target.value)} placeholder="Search symbol…" className="w-48 rounded-lg bg-slate-900 px-3 py-2 text-sm ring-1 ring-slate-700 focus:outline-none focus:ring-sky-400"/><button type="button" onClick={() => setShowDirectory(!showDirectory)} className="rounded-lg px-3 py-2 text-xs font-bold text-sky-200 ring-1 ring-slate-700 hover:bg-slate-800">{showDirectory ? "Hide list" : "Browse all"}</button></div></div>{showDirectory && <div className="mt-4 max-h-[520px] overflow-auto rounded-lg border border-slate-800"><div className="grid gap-x-4 px-3 sm:grid-cols-2 xl:grid-cols-3">{directoryRows.map((r) => <button key={r.symbol} type="button" onClick={() => setSelected(r.symbol)} className="flex items-center justify-between border-b border-slate-800 py-2 text-left hover:bg-white/[.025]"><span><b>{r.symbol}</b><span className={`ml-2 text-[10px] ${r.stale || r.state === "NO_DATA" ? "text-amber-300" : "text-slate-500"}`}>{!marketActive && r.bars ? "LAST SESSION" : r.stale ? "STALE" : r.state === "NO_DATA" ? "NO BARS" : "CURRENT"}</span></span><span className="tabnum text-xs text-slate-400">{r.change_from_baseline_pct == null ? "—" : `${signed(r.change_from_baseline_pct)}%`} →</span></button>)}</div>{directoryRows.length === 0 && <p className="p-4 text-sm text-slate-500">No symbol matches “{symbolQuery}”.</p>}</div>}</Panel>
        <p className="rounded-lg border border-slate-800 bg-slate-950/50 px-4 py-3 text-xs leading-relaxed text-slate-500">Universe: {market.coverage.universe.state === "FULL_CURRENT_MASTER" ? `full dated F&O master (${market.coverage.universe.master_symbols} stocks), as of ${market.coverage.universe.as_of}` : market.coverage.universe.state === "MAINTAINED_LIQUID_SUBSET" ? "maintained liquid F&O subset; run refresh-universe for the current full list" : market.coverage.universe.state === "MASTER_STALE_OR_INVALID" ? "saved F&O master is stale or invalid; using the subscribed set" : "custom subscribed symbol set"}. This scanner describes movement from the earliest available completed candle. It does not rank opportunities or predict returns.</p>
      </>}
    </section>
  );
}

function JournalPanel({ positions = [] }) {
  const [data, setData] = useState(null);
  const [symbol, setSymbol] = useState("");
  const [decision, setDecision] = useState("SKIPPED");
  const [referencePrice, setReferencePrice] = useState("");
  const [note, setNote] = useState("");
  const [positionId, setPositionId] = useState("");
  const [busy, setBusy] = useState(false);
  const [message, setMessage] = useState(null);
  const [error, setError] = useState(null);
  const refresh = useCallback(async () => {
    const r = await fetch("/journal");
    if (!r.ok) throw new Error(`Journal request returned ${r.status}`);
    setData(await r.json());
  }, []);
  useEffect(() => {
    refresh().catch((e) => setError(String(e)));
    const timer = setInterval(() => refresh().catch((e) => setError(String(e))), 15000);
    return () => clearInterval(timer);
  }, [refresh]);
  const submit = async (e) => {
    e.preventDefault(); setBusy(true); setError(null); setMessage(null);
    try {
      const r = await fetch("/journal/decisions", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ symbol, decision, position_id: positionId || null, reference_price: referencePrice ? Number(referencePrice) : null, note }) });
      const payload = await r.json();
      if (!r.ok) throw new Error(payload.detail || `Journal save returned ${r.status}`);
      setMessage(payload.note); setNote(""); await refresh();
    } catch (e) { setError(String(e)); }
    finally { setBusy(false); }
  };
  const money = (v) => v == null ? "—" : `₹${num(v)}`;
  return (
    <section id="journal" className="scroll-mt-36 space-y-4" aria-label="Trading journal">
      <div><div className="text-xs uppercase tracking-[.2em] text-sky-300 font-bold">Decision record</div><h2 className="mt-1 text-2xl font-black">Journal &amp; analytics</h2><p className="text-sm text-slate-400">Manual fills, skipped decisions, checks and exit guidance in one timeline.</p></div>
      <Panel title="Record a decision"><form onSubmit={submit} className="grid gap-3 sm:grid-cols-2 xl:grid-cols-[1fr_180px_180px_2fr_auto] items-end">
        <Input label="symbol" value={symbol} onChange={(e) => setSymbol(e.target.value.toUpperCase())} required maxLength="32" placeholder="e.g. RELIANCE" />
        <label><span className="block mb-1 text-xs uppercase tracking-wider text-slate-400">decision</span><select value={decision} onChange={(e) => setDecision(e.target.value)} className="w-full rounded bg-slate-800 px-3 py-2 ring-1 ring-slate-600 text-sm"><option value="SKIPPED">Skipped</option><option value="TAKEN">Taken</option></select></label>
        <Input label="reference price (optional)" type="number" min="0.01" step="0.01" value={referencePrice} onChange={(e) => setReferencePrice(e.target.value)} />
        <label><span className="block mb-1 text-xs uppercase tracking-wider text-slate-400">linked position (optional)</span><select value={positionId} onChange={(e) => setPositionId(e.target.value)} className="w-full rounded bg-slate-800 px-3 py-2 ring-1 ring-slate-600 text-sm"><option value="">No linked position</option>{positions.map((p) => <option key={p.position_id} value={p.position_id}>{p.symbol} · {p.position_id}</option>)}</select></label>
        <Input label="note" value={note} onChange={(e) => setNote(e.target.value)} maxLength="1200" placeholder="Reason, context, or what you observed" />
        <button disabled={busy || !symbol.trim()} className="rounded-lg bg-sky-400 px-4 py-2 font-bold text-slate-950 disabled:opacity-50">{busy ? "Saving…" : "Save note"}</button>
      </form><p className="mt-2 text-xs text-slate-500">A decision note does not create a position. Record fills separately in Position Tracker.</p>
      {message && <div role="status" className="mt-2 text-sm text-emerald-300">{message}</div>}{error && <div role="alert" className="mt-2 text-sm text-rose-300">Journal issue: {error}</div>}</Panel>
      {data && <>
        {data.read_errors && data.read_errors.map((e, i) => <div key={i} role="alert" className="rounded-lg border border-rose-700 bg-rose-950/50 px-4 py-3 text-sm text-rose-100">{e}</div>)}
        {!data.cost_model_verified && <div role="status" className="rounded-lg border border-amber-700/60 bg-amber-950/30 px-4 py-3 text-sm text-amber-100">Net P&amp;L is provisional: the cost model has not been reconciled with contract notes.</div>}
        <div className="grid grid-cols-2 gap-3 lg:grid-cols-4">
          <div className="rounded-xl desk-card ring-1 ring-slate-700 p-4"><div className="text-xs uppercase tracking-widest text-slate-400">Closed fills</div><div className="mt-1 text-2xl font-black tabnum">{data.analytics.closed_trade_count}</div></div>
          <div className="rounded-xl desk-card ring-1 ring-slate-700 p-4"><div className="text-xs uppercase tracking-widest text-slate-400">Gross realised</div><div className="mt-1 text-2xl font-black tabnum">{money(data.analytics.gross_realised)}</div></div>
          <div className="rounded-xl desk-card ring-1 ring-slate-700 p-4"><div className="text-xs uppercase tracking-widest text-slate-400">Modelled costs</div><div className="mt-1 text-2xl font-black tabnum text-amber-200">{money(data.analytics.modelled_costs)}</div></div>
          <div className="rounded-xl desk-card ring-1 ring-slate-700 p-4"><div className="text-xs uppercase tracking-widest text-slate-400">Net realised</div><div className={`mt-1 text-2xl font-black tabnum ${Number(data.analytics.net_realised) >= 0 ? "text-emerald-300" : "text-rose-300"}`}>{money(data.analytics.net_realised)}</div></div>
        </div>
        {data.analytics.check_summary && <div className="rounded-lg bg-slate-950/60 px-4 py-3 text-sm text-slate-300"><span className="font-bold">Check outcome review: </span>{data.analytics.check_summary.headline}</div>}
        <div className="grid gap-4 xl:grid-cols-2">
          <Panel title={`Closed fills · ${data.trades.length}`}>
            {data.trades.length ? <div className="space-y-2">{data.trades.map((t) => <div key={t.position_id} className="rounded-lg bg-slate-950/60 p-3"><div className="flex justify-between gap-2"><b>{t.symbol} · {t.quantity} shares</b><span className={`tabnum font-bold ${Number(t.net_pnl) >= 0 ? "text-emerald-300" : "text-rose-300"}`}>Net {money(t.net_pnl)}</span></div><div className="mt-1 text-xs text-slate-400">Entry {money(t.entry_price)} → exit {money(t.exit_price)} · costs {money(t.costs)} · {new Date(t.exit_time).toLocaleString("en-IN", { timeZone: "Asia/Kolkata" })}</div></div>)}</div> : <p className="text-sm text-slate-500">No manually closed fills recorded yet.</p>}
          </Panel>
          <Panel title={`Decision notes · ${data.decisions.length}`}>
            {data.decisions.length ? <div className="space-y-2">{data.decisions.slice(0, 12).map((d) => <div key={d.event_id} className="rounded-lg bg-slate-950/60 p-3"><div className="flex justify-between gap-2"><b>{d.symbol}</b><span className={`text-xs font-black ${d.decision === "TAKEN" ? "text-sky-300" : "text-amber-300"}`}>{d.decision}</span></div><div className="mt-1 text-sm text-slate-300">{d.note || "No note supplied."}</div><div className="mt-1 text-xs text-slate-500">{d.position_id ? `Position ${d.position_id} · ${d.outcome?.state === "CLOSED" ? `closed net ${money(d.outcome.net_pnl)}` : "open or not closed"} · ` : ""}{d.reference_price ? `Reference ₹${num(d.reference_price)} · ` : ""}{new Date(d.recorded_at).toLocaleString("en-IN", { timeZone: "Asia/Kolkata" })}</div></div>)}</div> : <p className="text-sm text-slate-500">No taken or skipped decisions noted yet.</p>}
          </Panel>
          <Panel title={`Entry checks · ${data.checks.length}`}>
            {data.checks.length ? <div className="max-h-72 space-y-2 overflow-auto">{data.checks.slice(0, 15).map((c) => <div key={c.check_id} className="flex items-start justify-between gap-3 border-b border-slate-800 py-2 text-sm"><div><b>{c.symbol}</b><div className="text-xs text-slate-400">{c.reason}</div></div><span className="shrink-0 text-xs text-slate-400">{c.verdict} · {c.outcome_state}</span></div>)}</div> : <p className="text-sm text-slate-500">No checks recorded.</p>}
          </Panel>
          <Panel title={`Exit advice history · ${data.exit_advice.length}`}>
            {data.exit_advice.length ? <div className="max-h-72 space-y-2 overflow-auto">{data.exit_advice.slice(0, 12).map((a, i) => <div key={`${a.asof}-${a.symbol}-${i}`} className="rounded-lg bg-slate-950/60 p-3"><div className="flex justify-between gap-2"><b>{a.symbol}</b><span className={a.stale ? "text-amber-300" : "text-slate-300"}>{a.stale ? "STALE" : a.state}</span></div><div className="mt-1 text-sm text-slate-400">{a.reason}</div>{a.net_pnl != null && <div className="mt-1 text-xs text-slate-500">Gross {money(a.gross_pnl)} · net {money(a.net_pnl)} · costs {money(a.costs)}</div>}</div>)}</div> : <p className="text-sm text-slate-500">No exit advice has been recorded yet.</p>}
          </Panel>
        </div>
        <p className="text-xs text-slate-500">{data.disclaimer}</p>
      </>}
    </section>
  );
}

/* ---------------------------------------------------------------- app */

function App() {
  const [snap, setSnap] = useState(null);
  const [connected, setConnected] = useState(false);
  const [fetchError, setFetchError] = useState(null);
  const wsRef = useRef(null);
  const retry = useRef(0);

  const connect = useCallback(() => {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${proto}://${location.host}/stream`);
    wsRef.current = ws;
    ws.onopen = () => { setConnected(true); retry.current = 0; };
    ws.onmessage = (e) => setSnap(JSON.parse(e.data));
    ws.onclose = () => {
      setConnected(false);
      const delay = Math.min(10000, 500 * Math.pow(2, retry.current++));
      setTimeout(connect, delay);
    };
    ws.onerror = () => ws.close();
  }, []);

  const refresh = useCallback(async () => {
    const res = await fetch("/positions");
    if (res.ok) {
      const data = await res.json();
      setSnap({ health: data.health, positions: data.positions,
                event_risk: data.event_risk, market: data.market });
    } else {
      setFetchError(`GET /positions returned ${res.status}`);
    }
  }, []);

  useEffect(() => { connect(); return () => wsRef.current && wsRef.current.close(); }, [connect]);

  /* Fetch once on mount rather than waiting for the first socket push. The page used
     to depend on the websocket for its ONLY data, so anything that stopped the server
     pushing left it sitting on empty defaults indefinitely -- with no error, because
     from the page's point of view nothing had failed yet. */
  useEffect(() => { refresh().catch((e) => setFetchError(String(e))); }, [refresh]);

  const closePosition = async (id, price) => {
    await fetch(`/positions/${id}`, {
      method: "DELETE", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ exit_price: price }),
    });
    refresh();
  };

  const positions = (snap && snap.positions) || [];
  // Most urgent first, so a second-monitor glance lands on what matters.
  const ORDER = ["STALE_DATA", "FORCE_EXIT", "EXIT_NOW", "INVALID_ENTRY", "TIME_EXIT",
                 "PARTIAL_EXIT", "TRAIL", "HOLD"];
  const sorted = [...positions].sort(
    (a, b) => ORDER.indexOf(a.state) - ORDER.indexOf(b.state));
  const empty = sorted.length === 0;
  /* Lets the empty state trigger the bulk check that already exists, rather than
     duplicating the fetch. One implementation, one set of guarantees. */
  const runAllRef = useRef(null);

  return (
    <div id="top" className="min-h-full desk-grid">
      <Header health={snap && snap.health} connected={connected} />
      {fetchError && (
        <div data-testid="fetch-error"
             className="alarm bg-red-700 text-white font-bold px-4 py-3 text-lg">
          Cannot reach the server: {fetchError}. Nothing on this page is current.
        </div>
      )}
      <main className="max-w-[1680px] mx-auto p-4 sm:p-6 space-y-5">
        <section className="flex flex-wrap items-end justify-between gap-4 py-2">
          <div>
            <div className="text-xs uppercase tracking-[.22em] text-sky-300 font-bold">Your market workspace</div>
            <h1 className="mt-1 text-3xl sm:text-4xl font-black tracking-tight text-slate-50">F&amp;O Market Desk</h1>
            <p className="mt-1 text-sm sm:text-base text-slate-400">Scan the market, inspect price structure, and manage your tracked positions.</p>
          </div>
          <div className="flex items-center gap-2 rounded-full border border-slate-700 bg-slate-950/80 px-3 py-1.5 text-xs font-semibold text-slate-300">
            <span className={`inline-block w-2 h-2 rounded-full ${connected ? "bg-emerald-400" : "bg-amber-400"}`}></span>
            {connected ? "Streaming updates" : "Reconnecting to updates"}
          </div>
        </section>
        <MarketPanel market={snap && snap.market} />
        {/* B. Health summary. Four operational facts, above everything, always. */}
        <HealthRow health={snap && snap.health} positions={positions} />

        <div className="grid grid-cols-1 xl:grid-cols-[1fr_400px] gap-4 items-start">
        {/* C/D. The wide column: positions own it when there are any, and the empty
            state offers the two things there are to do when there are none. */}
        <div id="positions" className="space-y-4 scroll-mt-36">
          {empty ? (
            <>
              <section data-testid="no-positions"
                   className="rounded-lg bg-slate-900/70 ring-1 ring-slate-700 px-5 py-5">
                <h2 className="text-lg font-bold text-slate-200">No open positions</h2>
                <p className="mt-1 text-[15px] text-slate-400 leading-relaxed">
                  Nothing is being tracked, so there is no exit advice to give. Two
                  things you can do from here — neither of them places an order, and
                  no order is ever placed by this tool.
                </p>
                <div className="mt-4 flex flex-wrap gap-3">
                  <button type="button" onClick={() => runAllRef.current && runAllRef.current()}
                    className="px-4 py-2.5 rounded bg-slate-700 hover:bg-slate-600
                               font-semibold text-[15px] focus:outline-none
                               focus:ring-2 focus:ring-sky-400">
                    Check tracked symbols
                  </button>
                  <button type="button" onClick={() => {
                      const f = document.querySelector('[data-testid="add-position-form"]');
                      if (f) { f.scrollIntoView({ block: "center" });
                               const i = f.querySelector("input"); if (i) i.focus(); }
                    }}
                    className="px-4 py-2.5 rounded bg-slate-700 hover:bg-slate-600
                               font-semibold text-[15px] focus:outline-none
                               focus:ring-2 focus:ring-sky-400">
                    Record a manually executed position
                  </button>
                </div>
              </section>
              <div id="checks" className="space-y-4 scroll-mt-36"><CheckAllPanel prominent onReady={(fn) => (runAllRef.current = fn)} />
              <CheckedLogPanel startedAt={snap && snap.health && snap.health.started_at} /></div>
            </>
          ) : (
            <>
              <div className="flex items-baseline gap-3">
                <h1 className="text-base font-bold uppercase tracking-widest text-slate-300">
                  Open positions
                </h1>
                <span className="text-[15px] text-slate-400">{sorted.length}</span>
              </div>
              {sorted.map((p) => (
                <PositionCard key={p.position_id} p={p} onClose={closePosition} />
              ))}
              <div id="checks" className="space-y-4 scroll-mt-36"><CheckAllPanel onReady={(fn) => (runAllRef.current = fn)} />
              <CheckedLogPanel startedAt={snap && snap.health && snap.health.started_at} /></div>
            </>
          )}
          <JournalPanel positions={snap?.positions || []} />
        </div>

        <div className="space-y-4">
          <CheckEntryPanel />
          <AddPositionForm onAdded={refresh} />
          <div id="event-risk" className="scroll-mt-36"><EventRiskPanel er={snap && snap.event_risk} /></div>
          {/* data-disclaimer marks safety prose that necessarily NAMES what it
              disclaims. The page-wide "no recommendation wording" scan removes these
              before checking, because otherwise the guard flags its own safety text --
              the trap every substring scan in this project has hit. */}
          <div data-disclaimer
               className="rounded-lg bg-slate-900/60 ring-1 ring-slate-700 p-5">
            <h2 className="text-base font-bold uppercase tracking-widest text-slate-300">
              Advisory only
            </h2>
            <p className="mt-2 text-[15px] leading-relaxed text-slate-300">
              This system never places, modifies or cancels an order.
            </p>
            <Why id="why-advisory" label="Why there is no signal panel">
              <p>
                Every exit is executed by you, manually, in your broker app. No broker
                order endpoint is reachable from this process.
              </p>
              <p>
                There is no signal panel. The ranking engine was evaluated at intraday,
                1-day, 3-day and 5-day horizons and produced no edge over a naive
                comparator at any of them, so showing its scores here would present a
                known-negative result as a recommendation.
              </p>
            </Why>
          </div>
        </div>
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>

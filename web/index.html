function ContextChecklist({ market, symbol }) {
  if (!market) return null;
  const stock = (market.symbols || []).find((r) => r.symbol === symbol);
  const direction = stock?.scanner?.direction;
  if (!stock || !direction) return null;
  const side = direction === "BULLISH" ? "bullish" : "bearish";
  const board = (market.scanner && market.scanner[side]) || [];
  const sector = (market.sectors || []).find((s) => s.sector === stock.sector);
  const up = Number(market.breadth?.up_from_baseline || 0);
  const down = Number(market.breadth?.down_from_baseline || 0);
  const vwap = stock.scanner.vwap;
  const price = stock.last_price;
  const checks = [
    { label: `Stock is on the ${side} board`, value: board.some((r) => r.symbol === symbol) },
    { label: "Sector average moves the same way", value: sector?.average_change_pct == null ? null : direction === "BULLISH" ? sector.average_change_pct > 0 : sector.average_change_pct < 0 },
    { label: "Market breadth leans the same way", value: market.breadth?.sample ? direction === "BULLISH" ? up > down : down > up : null },
    { label: "Price is on the same side of estimated VWAP", value: vwap == null || price == null ? null : direction === "BULLISH" ? price >= vwap : price <= vwap },
  ];
  const available = checks.filter((c) => c.value !== null).length;
  const aligned = checks.filter((c) => c.value === true).length;
  return <Panel title={`Context checklist · ${direction.toLowerCase()} observation`}>
    <div className="mb-2 text-xs text-slate-500">{aligned}/{available} available comparisons align. Descriptive context only; no trade signal or sizing instruction.{market.sectors_are_historical ? " Last-session context." : ""}</div>
    <ul className="grid gap-2 sm:grid-cols-2">{checks.map((c) => <li key={c.label} className="flex items-center gap-2 rounded-lg bg-slate-950/60 p-2 text-xs"><span className={c.value === null ? "text-slate-500" : c.value ? "text-emerald-300" : "text-amber-300"}>{c.value === null ? "—" : c.value ? "✓" : "·"}</span><span className="text-slate-300">{c.label}</span></li>)}</ul>
    <div className="mt-2 text-[10px] text-slate-500">A comparison can be unavailable when the sector, breadth sample, VWAP, or scanner observation is missing.</div>
  </Panel>;
}

function MarketChart({ symbol, market }) {
  const [chart, setChart] = useState(null);
  const [error, setError] = useState(null);
  const [interval, setInterval] = useState(5);
  useEffect(() => {
    let active = true;
    setChart(null); setError(null);
    fetch(`/market/${encodeURIComponent(symbol)}?interval=${interval}`)
      .then((r) => { if (!r.ok) throw new Error(`Chart request returned ${r.status}`); return r.json(); })
      .then((d) => { if (active) setChart(d); })
      .catch((e) => { if (active) setError(String(e)); });
    return () => { active = false; };
  }, [symbol, interval]);

  if (error) return <div role="alert" className="mt-4 rounded-lg bg-rose-950/60 p-4 text-rose-200">Chart unavailable: {error}</div>;
  if (!chart) return <div className="mt-4 rounded-lg bg-slate-950/60 p-4 text-slate-400">Loading completed candles for {symbol}…</div>;
  const allCandles = chart.candles || [];
  const offset = Math.max(0, allCandles.length - 120);
  const candles = allCandles.slice(-120);
  if (!candles.length) return <div className="mt-4 rounded-lg bg-slate-950/60 p-4 text-slate-400">No completed candles for {symbol} in this session.</div>;
  const W = 1000, H = 330, plotTop = 18, plotBottom = 264, volumeTop = 278, volumeBottom = 320;
  let cumulativePv = 0, cumulativeVolume = 0, vwapDate = null;
  const allVwap = allCandles.map((b) => {
    const date = b.time.slice(0, 10);
    if (date !== vwapDate) { cumulativePv = 0; cumulativeVolume = 0; vwapDate = date; }
    const typical = (b.high + b.low + b.close) / 3;
    cumulativePv += typical * b.volume; cumulativeVolume += b.volume;
    return cumulativeVolume ? cumulativePv / cumulativeVolume : null;
  });
  const vwapSeries = allVwap.slice(offset);
  const values = candles.flatMap((b) => [b.low, b.high]).concat(vwapSeries.filter((v) => v != null));
  const structure = interval === 5 ? (chart.structure || {}) : {};
  const activeZone = (chart.structure?.order_blocks || []).filter((z) => z.status !== "INVALIDATED").slice(-1)[0];
  const currentPrice = candles[candles.length - 1]?.close;
  const zoneDistance = activeZone && currentPrice != null
    ? currentPrice > activeZone.high ? { text: `${((currentPrice - activeZone.high) / currentPrice * 100).toFixed(2)}% above zone`, tone: "text-amber-200" }
      : currentPrice < activeZone.low ? { text: `${((activeZone.low - currentPrice) / currentPrice * 100).toFixed(2)}% below zone`, tone: "text-sky-200" }
      : { text: "inside zone", tone: "text-emerald-300" }
    : null;
  const latest = allCandles[allCandles.length - 1];
  const periodHigh = candles.length ? Math.max(...candles.map((b) => b.high)) : null;
  const periodLow = candles.length ? Math.min(...candles.map((b) => b.low)) : null;
  const indexByTime = new Map(candles.map((b, i) => [b.time, i]));
  const zones = (structure.order_blocks || []).filter((z) => indexByTime.has(z.formed_at));
  const levels = [...(structure.swing_highs || []).filter((l) => l.bar >= offset).slice(-5),
                  ...(structure.swing_lows || []).filter((l) => l.bar >= offset).slice(-5)];
  const equalHighs = (structure.equal_highs || []).filter((l) => l.last_bar >= offset);
  const equalLows = (structure.equal_lows || []).filter((l) => l.last_bar >= offset);
  zones.forEach((z) => values.push(z.low, z.high));
  equalHighs.forEach((l) => values.push(l.price)); equalLows.forEach((l) => values.push(l.price));
  const min = Math.min(...values), max = Math.max(...values), span = Math.max(max - min, max * 0.0001, 0.01);
  const y = (price) => plotTop + (max - price) / span * (plotBottom - plotTop);
  const step = (W - 44) / Math.max(candles.length, 1), body = Math.max(2, Math.min(7, step * 0.62));
  const maxVolume = Math.max(1, ...candles.map((b) => b.volume));

  return (
    <section className="mt-4 rounded-xl desk-card ring-1 ring-slate-700 p-4" aria-label={`${symbol} candlestick chart`}>
      <div className="flex flex-wrap items-center justify-between gap-2">
        <div><h3 className="text-xl font-black text-slate-100">{symbol} <span className="text-sm font-medium text-slate-400">{interval}m · {candles.length} completed bars shown</span></h3>
          <p className="text-xs text-slate-500">As of {hhmmss(chart.asof)} · data {chart.stale ? "STALE" : "current"}</p></div>
        <div className="flex items-center gap-2"><label className="text-xs text-slate-400">Candle size <select value={interval} onChange={(e) => setInterval(Number(e.target.value))} className="ml-1 rounded bg-slate-800 px-2 py-1 text-slate-100 ring-1 ring-slate-700"><option value="5">5 min · structure</option><option value="15">15 min · context</option><option value="1">1 min · detail</option></select></label><span className={`rounded-full px-3 py-1 text-xs font-bold ${chart.stale ? "bg-rose-950 text-rose-200" : "bg-emerald-950 text-emerald-200"}`}>{chart.stale ? "STALE DATA" : "FEED CURRENT"}</span></div>
      </div>
      {chart.stale && <div role="alert" className="mt-3 rounded-md bg-rose-950/70 px-3 py-2 text-sm font-bold text-rose-100">These candles are not current. Treat the displayed zones and levels as historical observations.</div>}
      <div className="mt-3 grid grid-cols-2 gap-2 sm:grid-cols-4"><div className="rounded-lg bg-slate-950/60 p-3"><div className="text-[10px] uppercase text-slate-500">Latest completed close</div><b className="tabnum text-lg">{latest ? `₹${num(latest.close)}` : "—"}</b></div><div className="rounded-lg bg-slate-950/60 p-3"><div className="text-[10px] uppercase text-slate-500">Shown period high</div><b className="tabnum text-lg text-emerald-300">{periodHigh == null ? "—" : `₹${num(periodHigh)}`}</b></div><div className="rounded-lg bg-slate-950/60 p-3"><div className="text-[10px] uppercase text-slate-500">Shown period low</div><b className="tabnum text-lg text-rose-300">{periodLow == null ? "—" : `₹${num(periodLow)}`}</b></div><div className="rounded-lg bg-slate-950/60 p-3"><div className="text-[10px] uppercase text-slate-500">Latest bar volume</div><b className="tabnum text-lg">{latest ? num(latest.volume) : "—"}</b></div></div>
      <div className="mt-3 overflow-x-auto rounded-lg bg-[#080d15]">
        <svg viewBox={`0 0 ${W} ${H}`} role="img" aria-label={`Candlesticks and volume for ${symbol}`} className="w-full min-w-[760px]">
          {[0,1,2,3].map((i) => <g key={i}><line x1="32" x2="990" y1={plotTop + i * (plotBottom - plotTop) / 3} y2={plotTop + i * (plotBottom - plotTop) / 3} stroke="#263244" strokeDasharray="3 5"/><text x="2" y={plotTop + i * (plotBottom - plotTop) / 3 + 4} fill="#64748b" fontSize="11">{num(max - i * span / 3)}</text></g>)}
          {zones.map((z, i) => { const at = indexByTime.get(z.formed_at); const x0 = at === undefined ? 32 : 32 + at * step; const inactive = z.status === "INVALIDATED"; return <rect key={`z${i}`} x={x0} y={y(z.high)} width={Math.max(8, W - 42 - x0)} height={Math.max(2, y(z.low) - y(z.high))} fill={z.direction === "BULLISH" ? "#34d399" : "#fb7185"} fillOpacity={inactive ? ".035" : ".13"} stroke={z.direction === "BULLISH" ? "#34d399" : "#fb7185"} strokeOpacity={inactive ? ".25" : ".65"} strokeDasharray={inactive ? "4 5" : undefined}><title>{z.direction} mechanical zone · {z.status} · {num(z.low)}–{num(z.high)}</title></rect>; })}
          {levels.map((l, i) => { const high = (structure.swing_highs || []).includes(l); return <line key={`l${i}`} x1="32" x2="990" y1={y(l.price)} y2={y(l.price)} stroke={high ? "#fbbf24" : "#38bdf8"} strokeOpacity=".55" strokeDasharray="5 5"><title>{high ? "Potential resistance / swing high" : "Potential support / swing low"} {num(l.price)}</title></line>; })}
          {equalHighs.map((l, i) => <line key={`eh${i}`} x1="32" x2="990" y1={y(l.price)} y2={y(l.price)} stroke="#c084fc" strokeOpacity=".8" strokeDasharray="3 4"><title>Potential equal highs · {l.touches} pivots near {num(l.price)}</title></line>)}
          {equalLows.map((l, i) => <line key={`el${i}`} x1="32" x2="990" y1={y(l.price)} y2={y(l.price)} stroke="#38bdf8" strokeOpacity=".8" strokeDasharray="3 4"><title>Potential equal lows · {l.touches} pivots near {num(l.price)}</title></line>)}
          {candles.map((b, i) => { const x = 34 + i * step, up = b.close >= b.open, color = up ? "#34d399" : "#fb7185"; const top = y(Math.max(b.open, b.close)), height = Math.max(1.5, Math.abs(y(b.open) - y(b.close))); return <g key={b.time}><line x1={x + body/2} x2={x + body/2} y1={y(b.high)} y2={y(b.low)} stroke={color} strokeWidth="1.4"/><rect x={x} y={top} width={body} height={height} fill={color}><title>{hhmmss(b.time)} O {num(b.open)} H {num(b.high)} L {num(b.low)} C {num(b.close)}</title></rect><rect x={x} y={volumeBottom - b.volume/maxVolume*(volumeBottom-volumeTop)} width={body} height={Math.max(1,b.volume/maxVolume*(volumeBottom-volumeTop))} fill={color} fillOpacity=".55"/></g>; })}
          {vwapSeries.some((v) => v != null) && <polyline points={vwapSeries.map((v, i) => v == null ? null : `${34 + i * step + body / 2},${y(v)}`).filter(Boolean).join(" ")} fill="none" stroke="#c084fc" strokeWidth="2" strokeDasharray="6 4"><title>Estimated session VWAP, using typical price and candle volume</title></polyline>}
          <line x1="32" x2="990" y1={volumeTop-4} y2={volumeTop-4} stroke="#334155"/>
        </svg>
      </div>
      <div className="mt-2 text-xs text-purple-300">Dashed violet line: estimated session VWAP from typical candle price × volume.</div>
      <div className="mt-1 text-[10px] text-slate-500">Zone-candle volume ratio compares the source five-minute candle with the average of up to 20 preceding five-minute candles. It is not volume-at-price, order-book depth, or proof of large-player activity.</div>
      {market && <div className="mt-3"><ContextChecklist market={market} symbol={symbol}/></div>}
      <div className="mt-3 grid gap-3 sm:grid-cols-3 text-sm">
        <div className="rounded-lg bg-slate-950/60 p-3"><div className="font-bold text-slate-200">Mechanical zones · 5-minute closes</div><div className="mt-1 text-slate-400">{interval !== 5 ? "Switch to the 5-minute view to see zones and structure levels." : zones.length ? zones.map((z) => `${z.direction} ${num(z.low)}–${num(z.high)} · midpoint ₹${num((z.low + z.high) / 2)} · invalidation boundary ₹${num(z.direction === "BULLISH" ? z.low : z.high)} · ${z.status} · ${z.retests} retest(s)${z.first_retest_at ? ` · first retest ${hhmmss(z.first_retest_at)}` : ""}${z.volume_ratio_at_zone == null ? "" : ` · zone-candle volume ${num(z.volume_ratio_at_zone)}× prior candles`}`).join(" · ") : "No pattern met the displayed mechanical rule."}{interval === 5 && zoneDistance && <div className={`mt-1 font-bold ${zoneDistance.tone}`}>Latest close {zoneDistance.text}{chart.stale ? " · historical/stale" : ""}</div>}</div></div>
        <div className="rounded-lg bg-slate-950/60 p-3"><div className="font-bold text-slate-200">Swing highs · unbroken price references</div><div className="mt-1 text-slate-400">{levels.filter((l) => (structure.swing_highs || []).includes(l)).map((l) => num(l.price)).join(" · ") || "No confirmed pivots."}</div></div>
        <div className="rounded-lg bg-slate-950/60 p-3"><div className="font-bold text-slate-200">Swing lows · confirmed price references</div><div className="mt-1 text-slate-400">{(structure.swing_lows || []).slice(-5).map((l) => num(l.price)).join(" · ") || "No confirmed pivots."}</div></div>
      </div>
      <div className="mt-3 grid gap-3 sm:grid-cols-2 text-sm"><div className="rounded-lg bg-purple-950/30 p-3"><div className="font-bold text-purple-200">Equal-high price references</div><div className="mt-1 text-slate-400">{equalHighs.map((l) => `${num(l.price)} (${l.touches} pivots · ${l.status})`).join(" · ") || "No equal-high clusters."}</div></div><div className="rounded-lg bg-sky-950/30 p-3"><div className="font-bold text-sky-200">Equal-low price references</div><div className="mt-1 text-slate-400">{equalLows.map((l) => `${num(l.price)} (${l.touches} pivots · ${l.status})`).join(" · ") || "No equal-low clusters."}</div></div></div>
      <p className="mt-3 text-xs leading-relaxed text-slate-500">{chart.disclaimer} Zones use completed candles with a displacement and break-of-structure rule. Status tracks subsequent retests and closes beyond the far edge. Equal-level status records whether a later candle closed through the reference; it cannot confirm resting orders.</p>
    </section>
  );
}

function MarketBreadthMap({ rows, rankedSymbols, onSelect }) {
  const points = rows.filter((r) => r.change_from_baseline_pct != null)
    .sort((a, b) => a.symbol.localeCompare(b.symbol));
  if (!points.length) return <Panel title="Market breadth map"><p className="text-sm text-slate-500">Waiting for completed-bar price changes.</p></Panel>;
  const changes = points.map((r) => Number(r.change_from_baseline_pct));
  const min = Math.min(0, ...changes), max = Math.max(0, ...changes), span = Math.max(max - min, 0.01);
  return <Panel title={`Market breadth map · ${points.length} stocks`}><p className="mb-2 text-xs text-slate-500">Each dot is a subscribed F&amp;O stock, positioned by observed change from the first available bar. Violet rings mark current board members. Hover or tap a dot to open its chart.</p><div className="overflow-x-auto rounded-lg bg-[#080d15] p-2"><svg viewBox="0 0 1000 104" role="img" aria-label="Stock breadth map positioned by price change" className="w-full min-w-[620px]"><line x1={30 + (0 - min) / span * 940} x2={30 + (0 - min) / span * 940} y1="7" y2="96" stroke="#94a3b8" strokeDasharray="4 4"/><text x="34" y="14" fill="#64748b" fontSize="10">{min.toFixed(2)}%</text><text x="950" y="14" fill="#64748b" fontSize="10" textAnchor="end">+{max.toFixed(2)}%</text>{points.map((r, i) => { const value = Number(r.change_from_baseline_pct), x = 30 + (value - min) / span * 940, y = 22 + (i * 37 % 68), picked = rankedSymbols.has(r.symbol), color = value > 0 ? "#34d399" : value < 0 ? "#fb7185" : "#94a3b8"; return <circle key={r.symbol} cx={x} cy={y} r={picked ? 4.1 : 3} fill={color} stroke={picked ? "#c084fc" : "#0b1220"} strokeWidth={picked ? 2 : 1} role="button" tabIndex="0" aria-label={`${r.symbol}, ${signed(value)} percent`} onClick={() => onSelect(r.symbol)} onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") onSelect(r.symbol); }}><title>{r.symbol} · {signed(value)}%{picked ? " · ranked board" : ""}</title></circle>; })}</svg></div><div className="mt-2 flex flex-wrap gap-4 text-[10px] text-slate-500"><span><i className="mr-1 inline-block h-2 w-2 rounded-full bg-emerald-400"/>positive</span><span><i className="mr-1 inline-block h-2 w-2 rounded-full bg-rose-400"/>negative</span><span><i className="mr-1 inline-block h-2 w-2 rounded-full border border-purple-400"/>ranked board member</span></div></Panel>;
}

function RankedBoard({ title, rows, tone, onSelect, emptyText, rankChanges, direction }) {
  return <Panel title={title}>{rows.length ? <ol className="space-y-2">{rows.map((r) => { const movement = rankChanges[`${direction}:${r.symbol}`]; return <li key={r.symbol}><button type="button" onClick={() => onSelect(r.symbol)} className="w-full rounded-lg border border-slate-800 bg-slate-950/60 p-3 text-left transition hover:border-emerald-500/50 hover:bg-slate-900"><div className="flex flex-wrap items-center justify-between gap-2"><div className="flex items-center gap-2"><span className="w-7 text-xs font-bold text-slate-500">#{r.rank}</span><b className="text-base text-slate-100">{r.symbol}</b>{movement && <span className={`rounded px-1.5 py-0.5 text-[10px] font-black ${movement === "NEW" ? "bg-sky-950 text-sky-300" : movement > 0 ? "bg-emerald-950 text-emerald-300" : "bg-rose-950 text-rose-300"}`}>{movement === "NEW" ? "NEW" : movement > 0 ? `↑${movement}` : `↓${Math.abs(movement)}`}</span>}<span className={`tabnum text-xs font-bold ${tone}`}>{signed(r.scanner.change_pct)}%</span></div><div className="flex gap-3 text-xs"><span className="text-slate-400">score <b className="tabnum text-slate-100">{num(r.scanner.score, 4)}</b></span><span className="text-slate-400">vol <b className="tabnum text-amber-200">{num(r.scanner.volume_ratio)}×</b></span><span className="text-slate-400">eff <b className="tabnum text-slate-200">{num(r.scanner.efficiency * 100, 0)}%</b></span></div></div><div className="mt-2 grid gap-x-4 gap-y-1 text-[11px] text-slate-500 sm:grid-cols-2"><span>Sector: {r.sector || "UNKNOWN"} · latest ₹{num(r.last_price)}</span><span>Session VWAP: {r.scanner.vwap == null ? "unavailable" : `₹${num(r.scanner.vwap)} · ${Number(r.last_price) >= Number(r.scanner.vwap) ? "above" : "below"}`}</span><span>Zones: {(r.structure.potential_zones || []).map((z) => `${z.direction} ${z.status} ₹${num(z.low)}–₹${num(z.high)} · ${z.retests} retest(s)`).join(" · ") || "none identified"}</span><span>Swing highs: {(r.structure.swing_highs || []).map((p) => `₹${num(p.price)}`).join(" · ") || "none"}</span><span>Swing lows: {(r.structure.swing_lows || []).map((p) => `₹${num(p.price)}`).join(" · ") || "none"}</span><span>Equal-high references: {(r.structure.equal_highs || []).map((p) => `₹${num(p.price)} · ${p.status}`).join(" · ") || "none"}</span><span>Equal-low references: {(r.structure.equal_lows || []).map((p) => `₹${num(p.price)} · ${p.status}`).join(" · ") || "none"}</span></div><div className="mt-2 text-right text-[10px] font-bold text-emerald-300">Open completed-candle chart →</div></button></li>; })}</ol> : <p className="py-6 text-sm text-slate-500">{emptyText}</p>}</Panel>;
}

function MarketPanel({ market, page, selected, setSelected }) {
  const [chartPopup, setChartPopup] = useState(false);
  const [symbolQuery, setSymbolQuery] = useState("");
  const [sectorFilter, setSectorFilter] = useState("ALL");
  const [movementFilter, setMovementFilter] = useState("ALL");
  const [showDirectory, setShowDirectory] = useState(false);
  const [showAllUp, setShowAllUp] = useState(false);
  const [showAllDown, setShowAllDown] = useState(false);
  const notifiedAlerts = useRef(null);
  const previousRanks = useRef(null);
  const [rankChanges, setRankChanges] = useState({});
  const rows = (market && market.symbols) || [];
  const chartSymbols = [...(market?.indices?.symbols || []), ...rows].map((r) => r.symbol).sort();
  const sectors = [...new Set(rows.map((r) => r.sector || "UNKNOWN"))].sort();
  const filteredRows = rows.filter((r) => (!symbolQuery.trim() || r.symbol.toLowerCase().includes(symbolQuery.trim().toLowerCase())) && (sectorFilter === "ALL" || (r.sector || "UNKNOWN") === sectorFilter) && (movementFilter === "ALL" || (movementFilter === "NO_DATA" ? r.state === "NO_DATA" : movementFilter === "STALE" ? r.stale : movementFilter === "UP" ? r.state === "UP_FROM_BASELINE" : movementFilter === "DOWN" ? r.state === "DOWN_FROM_BASELINE" : r.state === "AT_BASELINE")));
  const valid = rows.filter((r) => !r.stale && r.state !== "NO_DATA");
  const indexRows = (market && market.indices && market.indices.symbols) || [];
  const scanner = market && market.scanner;
  const rankSignature = JSON.stringify([[...(scanner?.bullish || []).map((r) => [r.symbol, r.rank])], [...(scanner?.bearish || []).map((r) => [r.symbol, r.rank])]]);
  useEffect(() => {
    const current = Object.fromEntries([...(scanner?.bullish || []).map((r) => [`UP:${r.symbol}`, r.rank]), ...(scanner?.bearish || []).map((r) => [`DOWN:${r.symbol}`, r.rank])]);
    if (previousRanks.current) {
      const changes = {};
      Object.entries(current).forEach(([symbol, rank]) => {
        const before = previousRanks.current[symbol];
        if (before == null) changes[symbol] = "NEW";
        else if (before !== rank) changes[symbol] = before - rank;
      });
      setRankChanges(changes);
      const highlightTimer = window.setTimeout(() => setRankChanges({}), 5000);
      return () => window.clearTimeout(highlightTimer);
    }
    previousRanks.current = current;
  }, [rankSignature]);
  const rankedSymbols = new Set([...(scanner?.bullish || []), ...(scanner?.bearish || [])].map((r) => r.symbol));
  const sectorMoves = [...((market && market.sectors) || [])].filter((s) => s.average_change_pct != null)
    .sort((a, b) => b.average_change_pct - a.average_change_pct);
  const unavailable = !market;
  const marketActive = market && ["OPEN", "SQUARE-OFF WINDOW"].includes(market.session_state);
  const observations = marketActive ? valid : rows.filter((r) => r.state !== "NO_DATA");
  const up = observations.filter((r) => r.state === "UP_FROM_BASELINE" && filteredRows.includes(r));
  const down = observations.filter((r) => r.state === "DOWN_FROM_BASELINE" && filteredRows.includes(r));
  const flat = observations.filter((r) => r.state === "AT_BASELINE");
  const alerts = (market && market.alerts) || [];
  const rankedRows = (items, direction) => (items || []).filter((r) =>
    (!symbolQuery.trim() || r.symbol.toLowerCase().includes(symbolQuery.trim().toLowerCase())) &&
    (sectorFilter === "ALL" || (r.sector || "UNKNOWN") === sectorFilter) &&
    (movementFilter === "ALL" || movementFilter === direction));
  useEffect(() => {
    const ids = alerts.map((a) => a.id);
    if (notifiedAlerts.current === null) { notifiedAlerts.current = new Set(ids); return; }
    const fresh = alerts.filter((a) => !notifiedAlerts.current.has(a.id));
    ids.forEach((id) => notifiedAlerts.current.add(id));
    if (fresh.length && "Notification" in window && Notification.permission === "granted") {
      const first = fresh[0];
      new Notification(fresh.length > 1 ? `${fresh.length} new price-structure observations` : `${first.symbol}: ${first.title}`, { body: fresh.length > 1 ? fresh.map((a) => `${a.symbol} · ${a.title}`).slice(0, 4).join("\n") : first.detail });
    }
  }, [market && market.asof, alerts]);
  useEffect(() => {
    if (!selected && market) {
      const preferred = market.scanner?.bullish?.[0]?.symbol || market.scanner?.bearish?.[0]?.symbol || rows[0]?.symbol || indexRows[0]?.symbol;
      if (preferred) setSelected(preferred);
    }
  }, [market, selected, rows, indexRows, setSelected]);
  useEffect(() => { setChartPopup(false); }, [page]);
  const SymbolRows = ({ items, tone, showAll, onToggle }) => {
    const shown = showAll ? items : items.slice(0, 8);
    return <>
      {shown.length ? <div className="divide-y divide-slate-800">{shown.map((r) => <button key={r.symbol} type="button" onClick={() => { setSelected(r.symbol); setChartPopup(true); }} className="group flex w-full items-center justify-between gap-3 py-2.5 text-left hover:bg-white/[.025]"><div><span className="font-bold text-slate-100">{r.symbol}</span><span className="ml-2 text-xs text-slate-500">{r.bars} bars</span></div><div className="flex items-center gap-3"><span className={`tabnum font-bold ${tone}`}>{signed(r.change_from_baseline_pct)}%</span><span className="text-xs text-sky-300 opacity-70 group-hover:opacity-100">View chart →</span></div></button>)}</div> : <p className="py-3 text-sm text-slate-500">No completed-bar observations in this group yet.</p>}
      {items.length > 8 && <button type="button" onClick={onToggle} className="mt-3 rounded-lg px-3 py-2 text-xs font-bold text-sky-200 ring-1 ring-slate-700 hover:bg-slate-800">{showAll ? "Show fewer" : `Show all ${items.length}`}</button>}
    </>;
  };
  const directoryRows = filteredRows;

  return (
    <section id={`market-${page}`} className="space-y-4" aria-label={`${page} market workspace`}>
      {unavailable ? <div role="status" className="rounded-xl desk-card ring-1 p-5 text-slate-400">Waiting for the first market snapshot. Coverage is limited to symbols subscribed in this session.</div> : <>
      {!marketActive && <div role="status" className="rounded-xl border border-amber-500/25 bg-amber-500/[.06] px-4 py-3 text-sm text-amber-100">Market closed · showing the last available session as historical context. Live readings resume during NSE market hours.</div>}
      {page === "overview" && <>
      <div className="flex flex-wrap items-end justify-between gap-3"><div><div className="text-xs uppercase tracking-[.2em] text-sky-300 font-bold">Observed market</div><h2 className="mt-1 text-2xl font-black">Market X-Ray</h2><p className="text-sm text-slate-400">Completed candles · descriptive breadth, not a prediction</p></div>
        {market && <div className="text-right text-xs text-slate-500">{marketActive ? `${market.coverage.fresh}/${market.coverage.subscribed} symbols current` : `${observations.length}/${market.coverage.subscribed} symbols with prior-session bars`} · as of {hhmmss(market.asof)}</div>}</div>
        <div className="grid grid-cols-2 lg:grid-cols-5 gap-3">
          <div className="rounded-xl desk-card ring-1 ring-slate-700 p-4"><div className="text-xs uppercase tracking-widest text-slate-400">{marketActive ? "Up from first bar" : "Last session · up"}</div><div className="mt-1 text-3xl font-black text-emerald-300 tabnum">{marketActive ? market.breadth.up_from_baseline : up.length}</div></div>
          <div className="rounded-xl desk-card ring-1 ring-slate-700 p-4"><div className="text-xs uppercase tracking-widest text-slate-400">{marketActive ? "Down from first bar" : "Last session · down"}</div><div className="mt-1 text-3xl font-black text-rose-300 tabnum">{marketActive ? market.breadth.down_from_baseline : down.length}</div></div>
          <div className="rounded-xl desk-card ring-1 ring-slate-700 p-4"><div className="text-xs uppercase tracking-widest text-slate-400">{marketActive ? "At first-bar baseline" : "Last session · flat"}</div><div className="mt-1 text-3xl font-black text-slate-200 tabnum">{marketActive ? market.breadth.at_baseline : flat.length}</div></div>
          <div className="rounded-xl desk-card ring-1 ring-slate-700 p-4"><div className="text-xs uppercase tracking-widest text-slate-400">{marketActive ? "Stale / no bars" : "Prior-session bars"}</div><div className="mt-1 text-3xl font-black text-amber-200 tabnum">{marketActive ? `${market.coverage.stale} / ${market.coverage.without_bars}` : `${observations.length} / ${market.coverage.subscribed}`}</div></div>
          <div className="col-span-2 lg:col-span-1 rounded-xl border border-slate-700 bg-slate-950/60 p-4"><div className="text-xs uppercase tracking-widest text-slate-400">Index context</div>{indexRows.length ? indexRows.map((r) => <div key={r.symbol} className="mt-2 flex items-center justify-between gap-2"><div><div className="text-xs font-bold text-slate-400">{r.symbol}</div><div className="tabnum font-black text-slate-100">{r.last_price == null ? "—" : `₹${num(r.last_price)}`}</div></div><span className={`tabnum text-sm font-bold ${r.stale && marketActive ? "text-amber-300" : Number(r.change_from_baseline_pct) >= 0 ? "text-emerald-300" : "text-rose-300"}`}>{r.stale && marketActive ? "STALE" : r.change_from_baseline_pct == null ? (marketActive ? "NO BARS" : "NO DATA") : `${signed(r.change_from_baseline_pct)}%`}</span></div>) : <div className="mt-2 font-bold text-slate-300">NIFTY · BANK NIFTY</div>}<div className="mt-1 text-xs text-slate-500">{indexRows.length ? (marketActive ? "Index prices from first available bar" : "Previous-session index context") : "Not subscribed to this feed"}</div></div>

function PnlHeatmap({ trades }) {
  const [offset, setOffset] = useState(0);
  const parts = new Intl.DateTimeFormat("en-US", { timeZone: "Asia/Kolkata", year: "numeric", month: "numeric" }).formatToParts(new Date());
  const yearPart = Number(parts.find((p) => p.type === "year").value);
  const monthPart = Number(parts.find((p) => p.type === "month").value);
  const monthStart = new Date(yearPart, monthPart - 1 + offset, 1);
  const monthKey = `${monthStart.getFullYear()}-${String(monthStart.getMonth() + 1).padStart(2, "0")}`;
  const monthTitle = new Intl.DateTimeFormat("en-IN", { month: "long", year: "numeric" }).format(new Date(Date.UTC(monthStart.getFullYear(), monthStart.getMonth(), 15, 12)));
  const daily = {};
  (trades || []).forEach((t) => {
    const key = new Date(t.exit_time).toLocaleDateString("en-CA", { timeZone: "Asia/Kolkata" });
    if (key.startsWith(monthKey)) { daily[key] = daily[key] || { net: 0, count: 0 }; daily[key].net += Number(t.net_pnl || 0); daily[key].count += 1; }
  });
  const maxAbsNet = Math.max(1, ...Object.values(daily).map((v) => Math.abs(v.net)));
  const dayCount = new Date(monthStart.getFullYear(), monthStart.getMonth() + 1, 0).getDate();
  const cells = [...Array(monthStart.getDay()).fill(null), ...Array.from({ length: dayCount }, (_, i) => i + 1)];
  while (cells.length % 7) cells.push(null);
  const pad = (n) => String(n).padStart(2, "0");
  return <Panel title="Net P&L calendar heatmap"><div className="mb-3 flex items-center justify-between gap-2"><button type="button" onClick={() => setOffset(offset - 1)} className="rounded-md px-3 py-1 text-xs font-bold ring-1 ring-slate-700">← Previous</button><b className="text-sm text-slate-200">{monthTitle}</b><button type="button" disabled={offset >= 0} onClick={() => setOffset(Math.min(0, offset + 1))} className="rounded-md px-3 py-1 text-xs font-bold ring-1 ring-slate-700 disabled:opacity-40">Next →</button></div><div className="grid grid-cols-7 gap-1 text-center">{["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map((d) => <div key={d} className="py-1 text-[10px] font-bold text-slate-500">{d}</div>)}{cells.map((day, i) => { if (!day) return <div key={`blank-${i}`} className="min-h-14 rounded-md bg-slate-950/30"/>; const key = `${monthKey}-${pad(day)}`, value = daily[key]; const intensity = value ? Math.abs(value.net) / maxAbsNet : 0; const tone = !value ? "bg-slate-950/40 text-slate-500" : value.net > 0 ? (intensity >= .66 ? "bg-emerald-500/40 text-emerald-100 ring-1 ring-emerald-700" : intensity >= .33 ? "bg-emerald-500/25 text-emerald-200 ring-1 ring-emerald-800/60" : "bg-emerald-500/10 text-emerald-200 ring-1 ring-emerald-950") : value.net < 0 ? (intensity >= .66 ? "bg-rose-500/40 text-rose-100 ring-1 ring-rose-700" : intensity >= .33 ? "bg-rose-500/25 text-rose-200 ring-1 ring-rose-800/60" : "bg-rose-500/10 text-rose-200 ring-1 ring-rose-950") : "bg-slate-800 text-slate-300"; return <div key={key} title={value ? `${key}: ${value.count} closed fill(s), net ${value.net.toFixed(2)}` : `${key}: no closed fills`} className={`min-h-14 rounded-md p-1 text-left ${tone}`}><div className="text-[10px] font-bold">{day}</div>{value && <><div className="mt-1 truncate text-[9px] font-bold">₹{num(value.net, 0)}</div><div className="text-[9px] opacity-70">{value.count} fill{value.count === 1 ? "" : "s"}</div></>}</div>; })}</div><div className="mt-3 flex flex-wrap items-center justify-between gap-2 text-[10px] text-slate-500"><span>Color intensity is relative within this month. Cells show closed-fill net P&amp;L by exit date (up to 300 recent journal fills); blank dates have no recorded closed fill.</span><span className="text-amber-300">Based on the configured cost model; provisional until verified against contract notes.</span></div></Panel>;
}

function RiskCalculator() {
  const [side, setSide] = useState("BULLISH");
  const [capital, setCapital] = useState("");
  const [riskPct, setRiskPct] = useState("");
  const [zonePrice, setZonePrice] = useState("");
  const [invalidation, setInvalidation] = useState("");
  const [target, setTarget] = useState("");
  const [quantity, setQuantity] = useState("");
  const [lotSize, setLotSize] = useState("");
  const numOrNull = (v) => v === "" ? null : Number(v);
  const cap = numOrNull(capital), pct = numOrNull(riskPct), entry = numOrNull(zonePrice);
  const stop = numOrNull(invalidation), targetPrice = numOrNull(target);
  const lot = numOrNull(lotSize), enteredQty = numOrNull(quantity);
  const riskPerUnit = entry != null && stop != null
    ? side === "BULLISH" ? entry - stop : stop - entry : null;
  const validBudget = cap > 0 && pct > 0 && pct <= 100;
  const validRisk = riskPerUnit > 0;
  const budget = validBudget ? cap * pct / 100 : null;
  const rawUnits = validBudget && validRisk ? Math.floor(budget / riskPerUnit) : null;
  const maxUnits = rawUnits == null ? null : lot > 0 ? Math.floor(rawUnits / lot) * lot : rawUnits;
  const usedUnits = enteredQty > 0 ? enteredQty : maxUnits;
  const estimatedRisk = usedUnits != null && validRisk ? usedUnits * riskPerUnit : null;
  const rewardPerUnit = entry != null && targetPrice != null
    ? side === "BULLISH" ? targetPrice - entry : entry - targetPrice : null;
  const rr = validRisk && rewardPerUnit > 0 ? rewardPerUnit / riskPerUnit : null;
  const breakEven = rr == null ? null : 100 / (1 + rr);
  const cash = (v) => v == null || !Number.isFinite(v) ? "—" : `₹${num(v, 2)}`;
  return <Panel title="Manual position-size & R:R calculator">
    <p className="mb-3 text-xs text-slate-400">Uses only values you enter. Set your own risk budget and invalidation level; the dashboard does not create stops, targets, or orders.</p>
    <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
      <label><span className="mb-1 block text-xs uppercase text-slate-400">side</span><select value={side} onChange={(e) => setSide(e.target.value)} className="w-full rounded bg-slate-800 px-3 py-2 text-sm ring-1 ring-slate-600"><option value="BULLISH">Bullish</option><option value="BEARISH">Bearish</option></select></label>
      <Input label="capital · ₹" type="number" min="0" step="any" value={capital} onChange={(e) => setCapital(e.target.value)} />
      <Input label="your risk limit · %" type="number" min="0" max="100" step="any" value={riskPct} onChange={(e) => setRiskPct(e.target.value)} />
      <Input label="planned price / Z · ₹" type="number" min="0" step="any" value={zonePrice} onChange={(e) => setZonePrice(e.target.value)} />
      <Input label="your invalidation · ₹" type="number" min="0" step="any" value={invalidation} onChange={(e) => setInvalidation(e.target.value)} />
      <Input label="optional target reference · ₹" type="number" min="0" step="any" value={target} onChange={(e) => setTarget(e.target.value)} />
      <Input label="quantity override · units" type="number" min="0" step="1" value={quantity} onChange={(e) => setQuantity(e.target.value)} />
      <Input label="optional lot size · units" type="number" min="0" step="1" value={lotSize} onChange={(e) => setLotSize(e.target.value)} />
    </div>
    <div className="mt-3 grid gap-2 sm:grid-cols-2 lg:grid-cols-4">
      <div className="rounded-lg bg-slate-950/60 p-3"><div className="text-[10px] uppercase text-slate-500">Risk per unit</div><b className="tabnum">{validRisk ? cash(riskPerUnit) : "Enter a valid zone and invalidation"}</b></div>
      <div className="rounded-lg bg-slate-950/60 p-3"><div className="text-[10px] uppercase text-slate-500">Risk budget · user set</div><b className="tabnum">{cash(budget)}</b></div>
      <div className="rounded-lg bg-slate-950/60 p-3"><div className="text-[10px] uppercase text-slate-500">Maximum quantity</div><b className="tabnum">{maxUnits == null ? "—" : `${maxUnits} units`}</b></div>
      <div className="rounded-lg bg-slate-950/60 p-3"><div className="text-[10px] uppercase text-slate-500">Estimated risk · entered quantity or max</div><b className={`tabnum ${budget != null && estimatedRisk > budget ? "text-amber-300" : "text-slate-100"}`}>{cash(estimatedRisk)}</b></div>
    </div>
    <div className="mt-2 text-xs text-slate-400">{rr == null ? "Add a target on the reward side to calculate gross R:R and its break-even win rate." : `Gross R:R 1 : ${rr.toFixed(2)} · break-even win rate ${breakEven.toFixed(1)}% before costs; arithmetic, not a forecast.`} {lot > 0 ? "Maximum quantity is rounded down to your entered lot size." : "Enter a lot size if you want the maximum quantity rounded down to whole lots."}</div>
    {validBudget && validRisk && enteredQty > 0 && estimatedRisk > budget && <div role="status" className="mt-2 rounded border border-amber-700 bg-amber-950/30 p-2 text-xs text-amber-200">Entered quantity exceeds the risk budget you set. This is a calculation only; the dashboard does not block or place trades.</div>}
  </Panel>;
}

function Playbook() {
  const lessons = [
    ["1 · Check data first", "Confirm the session is open, the feed is current, and enough completed bars are available. Stale or historical rows describe past data; wait for live data before making any decision."],
    ["2 · Read the board as a scan", "The order is a transparent price/volume comparison, not a probability or buy/sell instruction. Open the chart, inspect the candles and sector breadth, and remember intraday OI is not part of this board."],
    ["3 · Wait for price to revisit a zone", "A zone starts as awaiting retest, then records later candle overlaps and any close invalidation. The first retest time is shown when available. These are historical candle facts; no retest is guaranteed to hold, and a wick alone does not mark a zone broken."],
    ["4 · Calculate risk from your own levels", "Use the manual calculator below with your own capital, risk limit, planned price, and invalidation. Its size and break-even R:R calculations are arithmetic only, before fees/slippage where noted. It does not verify a stop, offer trade approval, or send an order."],
    ["5 · Review the record", "Log the setup and habits (for example, first retest, chased, or two-way day), link a manual fill, then review the calendar and net results by tag. Modelled costs remain provisional until reconciled with contract notes."],
    ["Daily guardrail", "Set any daily loss cap yourself before the session and avoid increasing size to recover a loss. The Journal can compare your cap with recorded closed-fill net for today; open, unrecorded, or broker-side fills are not included, and the dashboard never blocks orders."],
    ["Options data boundary", "This dashboard observes underlying stock candles. It has no option chain, premium, implied volatility, Greeks, or expiry-decay feed, so it cannot calculate option value or suggest a call/put. Underlying price movement does not determine an option premium by itself."],
  ];
  return <section id="playbook" className="scroll-mt-36 space-y-3" aria-label="Trading terminal playbook"><div><div className="text-xs uppercase tracking-[.2em] text-sky-300 font-bold">Quick guide</div><h2 className="mt-1 text-xl font-black">Terminal playbook</h2><p className="text-xs text-slate-500">How to read the observations and maintain your own risk process.</p></div><div className="grid gap-2 md:grid-cols-2 xl:grid-cols-3">{lessons.map(([title, body]) => <details key={title} className="rounded-xl desk-card p-4 ring-1 ring-slate-800"><summary className="cursor-pointer text-sm font-bold text-slate-200">{title}</summary><p className="mt-3 text-sm leading-relaxed text-slate-400">{body}</p></details>)}</div><RiskCalculator /></section>;
}

  const [targetReference, setTargetReference] = useState("");
  const [plannedQuantity, setPlannedQuantity] = useState("");
  const [dailyLossCap, setDailyLossCap] = useState("");
  const [journalFrom, setJournalFrom] = useState("");
  const [journalTo, setJournalTo] = useState("");
  const [note, setNote] = useState("");
  const [setupTag, setSetupTag] = useState("UNSPECIFIED");
  const [habitTags, setHabitTags] = useState("");
  const [positionId, setPositionId] = useState("");
  const [busy, setBusy] = useState(false);
  const [message, setMessage] = useState(null);
  const [error, setError] = useState(null);
  const refresh = useCallback(async () => {
    const r = await fetch("/journal");
    if (!r.ok) throw new Error(`Journal request returned ${r.status}`);
    setData(await r.json());
  }, []);
  useEffect(() => {
    refresh().catch((e) => setError(String(e)));
    const timer = setInterval(() => refresh().catch((e) => setError(String(e))), 15000);
    return () => clearInterval(timer);
  }, [refresh]);
  const submit = async (e) => {
    e.preventDefault(); setBusy(true); setError(null); setMessage(null);
    try {
      const r = await fetch("/journal/decisions", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ symbol, decision, position_id: positionId || null, reference_price: referencePrice ? Number(referencePrice) : null, side: planSide || null, zone_price: zonePrice ? Number(zonePrice) : null, invalidation_price: invalidationPrice ? Number(invalidationPrice) : null, target_reference_price: targetReference ? Number(targetReference) : null, planned_quantity: plannedQuantity ? Number(plannedQuantity) : null, note, setup_tag: setupTag, habit_tags: habitTags.split(",").map((t) => t.trim()).filter(Boolean).slice(0, 6) }) });
      const payload = await r.json();
      if (!r.ok) throw new Error(payload.detail || `Journal save returned ${r.status}`);
      setMessage(payload.note); setNote(""); await refresh();
    } catch (e) { setError(String(e)); }
    finally { setBusy(false); }
  };
  const money = (v) => v == null ? "—" : `₹${num(v)}`;
  const todayIst = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Kolkata", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
  const closedToday = (data?.trades || []).filter((t) => t.exit_time && new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Kolkata", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date(t.exit_time)) === todayIst);
  const closedTodayNet = closedToday.reduce((sum, t) => sum + Number(t.net_pnl || 0), 0);
  const visibleTrades = (data?.trades || []).filter((t) => {
    const day = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Kolkata", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date(t.exit_time));
    return (!journalFrom || day >= journalFrom) && (!journalTo || day <= journalTo);
  });
  const capValue = dailyLossCap === "" ? null : Number(dailyLossCap);
  return (
    <section id="journal" className="scroll-mt-36 space-y-4" aria-label="Trading journal">
      <div><div className="text-xs uppercase tracking-[.2em] text-sky-300 font-bold">Decision record</div><h2 className="mt-1 text-2xl font-black">Journal &amp; analytics</h2><p className="text-sm text-slate-400">Manual fills, skipped decisions, checks and exit guidance in one timeline.</p></div>
      <Panel title="Record a decision"><form onSubmit={submit} className="grid gap-3 sm:grid-cols-2 xl:grid-cols-4 items-end">
        <Input label="symbol" value={symbol} onChange={(e) => setSymbol(e.target.value.toUpperCase())} required maxLength="32" placeholder="e.g. RELIANCE" />
        <label><span className="block mb-1 text-xs uppercase tracking-wider text-slate-400">decision</span><select value={decision} onChange={(e) => setDecision(e.target.value)} className="w-full rounded bg-slate-800 px-3 py-2 ring-1 ring-slate-600 text-sm"><option value="SKIPPED">Skipped</option><option value="TAKEN">Taken</option></select></label>
        <label><span className="block mb-1 text-xs uppercase tracking-wider text-slate-400">planned side (optional)</span><select value={planSide} onChange={(e) => setPlanSide(e.target.value)} className="w-full rounded bg-slate-800 px-3 py-2 ring-1 ring-slate-600 text-sm"><option value="">Not recorded</option><option value="BULLISH">Bullish</option><option value="BEARISH">Bearish</option></select></label>
        <Input label="zone reference · ₹ (optional)" type="number" min="0.01" step="any" value={zonePrice} onChange={(e) => setZonePrice(e.target.value)} />
        <Input label="invalidation boundary · ₹ (optional)" type="number" min="0.01" step="any" value={invalidationPrice} onChange={(e) => setInvalidationPrice(e.target.value)} />
        <Input label="target reference · ₹ (optional)" type="number" min="0.01" step="any" value={targetReference} onChange={(e) => setTargetReference(e.target.value)} />
        <Input label="planned quantity · units (optional)" type="number" min="1" step="1" value={plannedQuantity} onChange={(e) => setPlannedQuantity(e.target.value)} />
        <Input label="reference price (optional)" type="number" min="0.01" step="0.01" value={referencePrice} onChange={(e) => setReferencePrice(e.target.value)} />
        <label><span className="block mb-1 text-xs uppercase tracking-wider text-slate-400">linked position (optional)</span><select value={positionId} onChange={(e) => setPositionId(e.target.value)} className="w-full rounded bg-slate-800 px-3 py-2 ring-1 ring-slate-600 text-sm"><option value="">No linked position</option>{positions.map((p) => <option key={p.position_id} value={p.position_id}>{p.symbol} · {p.position_id}</option>)}</select></label>
        <Input label="note" value={note} onChange={(e) => setNote(e.target.value)} maxLength="1200" placeholder="Reason, context, or what you observed" />
        <Input label="setup tag" value={setupTag} onChange={(e) => setSetupTag(e.target.value)} maxLength="64" placeholder="e.g. first retest" />
        <Input label="habit tags · comma separated" value={habitTags} onChange={(e) => setHabitTags(e.target.value)} maxLength="200" placeholder="e.g. chased, two-way day" />
        <button disabled={busy || !symbol.trim()} className="rounded-lg bg-sky-400 px-4 py-2 font-bold text-slate-950 disabled:opacity-50">{busy ? "Saving…" : "Save note"}</button>
      </form><p className="mt-2 text-xs text-slate-500">A decision note does not create a position. Record fills separately in Position Tracker.</p>
      {message && <div role="status" className="mt-2 text-sm text-emerald-300">{message}</div>}{error && <div role="alert" className="mt-2 text-sm text-rose-300">Journal issue: {error}</div>}</Panel>
      {data && <>
        {data.read_errors && data.read_errors.map((e, i) => <div key={i} role="alert" className="rounded-lg border border-rose-700 bg-rose-950/50 px-4 py-3 text-sm text-rose-100">{e}</div>)}
        {!data.cost_model_verified && <div role="status" className="rounded-lg border border-amber-700/60 bg-amber-950/30 px-4 py-3 text-sm text-amber-100">Net P&amp;L is provisional: the cost model has not been reconciled with contract notes.</div>}
        <div className="grid grid-cols-2 gap-3 lg:grid-cols-4">
          <div className="rounded-xl desk-card ring-1 ring-slate-700 p-4"><div className="text-xs uppercase tracking-widest text-slate-400">Closed fills</div><div className="mt-1 text-2xl font-black tabnum">{data.analytics.closed_trade_count}</div></div>
          <div className="rounded-xl desk-card ring-1 ring-slate-700 p-4"><div className="text-xs uppercase tracking-widest text-slate-400">Gross realised</div><div className="mt-1 text-2xl font-black tabnum">{money(data.analytics.gross_realised)}</div></div>
          <div className="rounded-xl desk-card ring-1 ring-slate-700 p-4"><div className="text-xs uppercase tracking-widest text-slate-400">Modelled costs</div><div className="mt-1 text-2xl font-black tabnum text-amber-200">{money(data.analytics.modelled_costs)}</div></div>
          <div className="rounded-xl desk-card ring-1 ring-slate-700 p-4"><div className="text-xs uppercase tracking-widest text-slate-400">Net realised</div><div className={`mt-1 text-2xl font-black tabnum ${Number(data.analytics.net_realised) >= 0 ? "text-emerald-300" : "text-rose-300"}`}>{money(data.analytics.net_realised)}</div></div>
        </div>
        <Panel title="Daily loss guardrail · recorded closed fills"><div className="grid gap-3 sm:grid-cols-3 sm:items-end"><Input label="your daily loss cap · ₹ (optional)" type="number" min="0" step="any" value={dailyLossCap} onChange={(e) => setDailyLossCap(e.target.value)} /><div className="rounded-lg bg-slate-950/60 p-3"><div className="text-[10px] uppercase text-slate-500">Closed-fill net today · IST</div><b className={`tabnum ${closedTodayNet >= 0 ? "text-emerald-300" : "text-rose-300"}`}>{money(closedTodayNet)}</b><div className="text-[10px] text-slate-500">{closedToday.length} recorded close(s)</div></div><div role="status" className="rounded-lg bg-slate-950/60 p-3 text-xs text-slate-300">{capValue == null || capValue <= 0 ? "Enter a cap to compare it with recorded closes." : closedTodayNet <= -capValue ? "Recorded closed-fill loss has reached this user-set cap." : `${money(Math.max(0, capValue + Math.min(0, closedTodayNet)))} of the user-set cap remains, based on recorded closed fills.`}</div></div><p className="mt-2 text-[10px] text-slate-500">This does not include open or unrecorded trades and does not block orders. Net P&amp;L uses the configured cost model and may be provisional.</p></Panel>
        <Panel title="Closed fill date range"><div className="grid gap-3 sm:grid-cols-3 sm:items-end"><Input label="From · exit date (IST)" type="date" value={journalFrom} onChange={(e) => setJournalFrom(e.target.value)} /><Input label="To · exit date (IST)" type="date" value={journalTo} onChange={(e) => setJournalTo(e.target.value)} /><button type="button" onClick={() => { setJournalFrom(""); setJournalTo(""); }} className="rounded-lg px-4 py-2 text-sm font-bold text-slate-200 ring-1 ring-slate-700 hover:bg-slate-800">Clear dates</button></div><p className="mt-2 text-[10px] text-slate-500">Date range filters the calendar and closed-fill list below. Summary analytics above cover all journal history returned by the server (up to its existing recent-history limit).</p></Panel>
        <PnlHeatmap trades={visibleTrades}/>
        <div className="grid gap-3 lg:grid-cols-2"><Panel title="Closed net by setup">{data.setup_analytics && data.setup_analytics.length ? <div className="space-y-2">{data.setup_analytics.map((x) => <div key={x.tag} className="flex items-center justify-between gap-3 rounded-lg bg-slate-950/60 p-2 text-sm"><span>{x.tag} <small className="text-slate-500">· {x.closed_trades} linked fill(s)</small></span><b className={`tabnum ${Number(x.net_realised) >= 0 ? "text-emerald-300" : "text-rose-300"}`}>{money(x.net_realised)}</b></div>)}</div> : <p className="text-sm text-slate-500">Link a decision note to a closed position to see setup results.</p>}</Panel><Panel title="Closed net by habit">{data.habit_analytics && data.habit_analytics.length ? <div className="space-y-2">{data.habit_analytics.map((x) => <div key={x.tag} className="flex items-center justify-between gap-3 rounded-lg bg-slate-950/60 p-2 text-sm"><span>{x.tag} <small className="text-slate-500">· {x.closed_trades} linked fill(s)</small></span><b className={`tabnum ${Number(x.net_realised) >= 0 ? "text-emerald-300" : "text-rose-300"}`}>{money(x.net_realised)}</b></div>)}</div> : <p className="text-sm text-slate-500">Add habit tags to linked decision notes to compare realized results.</p>}</Panel></div>
        {data.analytics.check_summary && <div className="rounded-lg bg-slate-950/60 px-4 py-3 text-sm text-slate-300"><span className="font-bold">Check outcome review: </span>{data.analytics.check_summary.headline}</div>}
        <div className="grid gap-4 xl:grid-cols-2">
          <Panel title={`Closed fills · ${visibleTrades.length} shown / ${data.trades.length}`}>
            {visibleTrades.length ? <div className="space-y-2">{visibleTrades.map((t) => <div key={t.position_id} className="rounded-lg bg-slate-950/60 p-3"><div className="flex justify-between gap-2"><b>{t.symbol} · {t.quantity} shares</b><span className={`tabnum font-bold ${Number(t.net_pnl) >= 0 ? "text-emerald-300" : "text-rose-300"}`}>Net {money(t.net_pnl)}</span></div><div className="mt-1 text-xs text-slate-400">Entry {money(t.entry_price)} → exit {money(t.exit_price)} · costs {money(t.costs)} · {new Date(t.exit_time).toLocaleString("en-IN", { timeZone: "Asia/Kolkata" })}</div></div>)}</div> : <p className="text-sm text-slate-500">No closed fills match these dates.</p>}
          </Panel>
          <Panel title={`Decision notes · ${data.decisions.length}`}>
            {data.decisions.length ? <div className="space-y-2">{data.decisions.slice(0, 12).map((d) => <div key={d.event_id} className="rounded-lg bg-slate-950/60 p-3"><div className="flex justify-between gap-2"><b>{d.symbol}</b><span className={`text-xs font-black ${d.decision === "TAKEN" ? "text-sky-300" : "text-amber-300"}`}>{d.decision}</span></div><div className="mt-1 text-sm text-slate-300">{d.note || "No note supplied."}</div><div className="mt-1 text-xs text-slate-400">Plan: {[d.side, d.zone_price ? `zone ₹${num(d.zone_price)}` : null, d.invalidation_price ? `invalidation ₹${num(d.invalidation_price)}` : null, d.target_reference_price ? `target ref ₹${num(d.target_reference_price)}` : null, d.planned_quantity ? `${d.planned_quantity} units` : null].filter(Boolean).join(" · ") || "—"}</div><div className="mt-1 text-xs text-slate-400">Setup: {d.setup_tag || "UNSPECIFIED"} · Habits: {(d.habit_tags || []).join(", ") || "—"}</div><div className="mt-1 text-xs text-slate-500">{d.position_id ? `Position ${d.position_id} · ${d.outcome?.state === "CLOSED" ? `closed net ${money(d.outcome.net_pnl)}` : "open or not closed"} · ` : ""}{d.reference_price ? `Reference ₹${num(d.reference_price)} · ` : ""}{new Date(d.recorded_at).toLocaleString("en-IN", { timeZone: "Asia/Kolkata" })}</div></div>)}</div> : <p className="text-sm text-slate-500">No taken or skipped decisions noted yet.</p>}
          </Panel>
          <Panel title={`Entry checks · ${data.checks.length}`}>
            {data.checks.length ? <div className="max-h-72 space-y-2 overflow-auto">{data.checks.slice(0, 15).map((c) => <div key={c.check_id} className="flex items-start justify-between gap-3 border-b border-slate-800 py-2 text-sm"><div><b>{c.symbol}</b><div className="text-xs text-slate-400">{c.reason}</div></div><span className="shrink-0 text-xs text-slate-400">{c.verdict} · {c.outcome_state}</span></div>)}</div> : <p className="text-sm text-slate-500">No checks recorded.</p>}
          </Panel>
          <Panel title={`Exit advice history · ${data.exit_advice.length}`}>
            {data.exit_advice.length ? <div className="max-h-72 space-y-2 overflow-auto">{data.exit_advice.slice(0, 12).map((a, i) => <div key={`${a.asof}-${a.symbol}-${i}`} className="rounded-lg bg-slate-950/60 p-3"><div className="flex justify-between gap-2"><b>{a.symbol}</b><span className={a.stale ? "text-amber-300" : "text-slate-300"}>{a.stale ? "STALE" : a.state}</span></div><div className="mt-1 text-sm text-slate-400">{a.reason}</div>{a.net_pnl != null && <div className="mt-1 text-xs text-slate-500">Gross {money(a.gross_pnl)} · net {money(a.net_pnl)} · costs {money(a.costs)}</div>}</div>)}</div> : <p className="text-sm text-slate-500">No exit advice has been recorded yet.</p>}
          </Panel>
        </div>
        <p className="text-xs text-slate-500">{data.disclaimer}</p>
      </>}
    </section>
  );
}

/* ---------------------------------------------------------------- app */

function App() {
  const [snap, setSnap] = useState(null);
  const [connected, setConnected] = useState(false);
  const [fetchError, setFetchError] = useState(null);
  const [activePage, setActivePage] = useState(pageFromHash);
  const [selectedSymbol, setSelectedSymbol] = useState(null);
  const wsRef = useRef(null);
  const retry = useRef(0);

  const navigate = useCallback((page) => {
    const next = APP_PAGES.some((item) => item.id === page) ? page : "overview";
    if (location.hash !== `#/${next}`) history.pushState(null, "", `#/${next}`);
    setActivePage(next);
    window.scrollTo(0, 0);
  }, []);

  useEffect(() => {
    const syncPage = () => setActivePage(pageFromHash());
    window.addEventListener("popstate", syncPage);
    window.addEventListener("hashchange", syncPage);
    return () => {
      window.removeEventListener("popstate", syncPage);
      window.removeEventListener("hashchange", syncPage);
    };
  }, []);

  const connect = useCallback(() => {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${proto}://${location.host}/stream`);
    wsRef.current = ws;
    ws.onopen = () => { setConnected(true); retry.current = 0; };
    ws.onmessage = (e) => setSnap(JSON.parse(e.data));
    ws.onclose = () => {
      setConnected(false);
      const delay = Math.min(10000, 500 * Math.pow(2, retry.current++));
      setTimeout(connect, delay);
    };
    ws.onerror = () => ws.close();
  }, []);

  const refresh = useCallback(async () => {
    const res = await fetch("/positions");
    if (res.ok) {
      const data = await res.json();
      setSnap({ health: data.health, positions: data.positions,
                event_risk: data.event_risk, market: data.market });
    } else {
      setFetchError(`GET /positions returned ${res.status}`);
    }
  }, []);

  useEffect(() => { connect(); return () => wsRef.current && wsRef.current.close(); }, [connect]);

  /* Fetch once on mount rather than waiting for the first socket push. The page used
     to depend on the websocket for its ONLY data, so anything that stopped the server
     pushing left it sitting on empty defaults indefinitely -- with no error, because
     from the page's point of view nothing had failed yet. */
  useEffect(() => { refresh().catch((e) => setFetchError(String(e))); }, [refresh]);

  const closePosition = async (id, price) => {
    await fetch(`/positions/${id}`, {
      method: "DELETE", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ exit_price: price }),
    });
    refresh();
  };

  const positions = (snap && snap.positions) || [];
  // Most urgent first, so a second-monitor glance lands on what matters.
  const ORDER = ["STALE_DATA", "FORCE_EXIT", "EXIT_NOW", "INVALID_ENTRY", "TIME_EXIT",
                 "PARTIAL_EXIT", "TRAIL", "HOLD"];
  const sorted = [...positions].sort(
    (a, b) => ORDER.indexOf(a.state) - ORDER.indexOf(b.state));
  const empty = sorted.length === 0;
  /* Lets the empty state trigger the bulk check that already exists, rather than
     duplicating the fetch. One implementation, one set of guarantees. */
  const runAllRef = useRef(null);

  const pageMeta = APP_PAGES.find((page) => page.id === activePage) || APP_PAGES[0];
  const healthStartedAt = snap?.health?.started_at;
  return (
    <div id="top" className="min-h-full desk-grid">
      <Header health={snap && snap.health} connected={connected} activePage={activePage} onNavigate={navigate} />
      {fetchError && <div data-testid="fetch-error" className="alarm bg-red-700 px-4 py-3 text-lg font-bold text-white">Cannot reach the server: {fetchError}. Nothing on this page is current.</div>}
      <main className="mx-auto max-w-[1680px] space-y-5 p-4 sm:p-6">
        <section className="flex flex-wrap items-end justify-between gap-4 py-2">
          <div><div className="text-xs font-bold uppercase tracking-[.22em] text-sky-300">F&amp;O Market Desk</div><h1 className="market-title mt-1 text-3xl font-black tracking-tight sm:text-4xl">{pageMeta.title}</h1><p className="mt-1 text-sm text-slate-400 sm:text-base">{pageMeta.description}</p></div>
          <div className="flex items-center gap-2 rounded-full border border-slate-700 bg-slate-950/80 px-3 py-1.5 text-xs font-semibold text-slate-300"><span className={`inline-block h-2 w-2 rounded-full ${connected ? "bg-emerald-400" : "bg-amber-400"}`}></span>{connected ? "Streaming updates" : "Reconnecting to updates"}</div>
        </section>

        {activePage === "overview" && <><MarketPanel market={snap && snap.market} page="overview" selected={selectedSymbol} setSelected={setSelectedSymbol}/><HealthRow health={snap && snap.health} positions={positions}/></>}
        {activePage === "scanner" && <MarketPanel market={snap && snap.market} page="scanner" selected={selectedSymbol} setSelected={setSelectedSymbol}/>}
        {activePage === "structure" && <MarketPanel market={snap && snap.market} page="structure" selected={selectedSymbol} setSelected={setSelectedSymbol}/>}

        {activePage === "positions" && <>
          <HealthRow health={snap && snap.health} positions={positions}/>
          <div className="grid items-start gap-4 xl:grid-cols-[1fr_400px]">
            <section id="positions" className="space-y-4" aria-label="Open positions">
              {empty ? <div data-testid="no-positions" className="rounded-lg bg-slate-900/70 px-5 py-5 ring-1 ring-slate-700"><h2 className="text-lg font-bold text-slate-200">No open positions</h2><p className="mt-1 leading-relaxed text-slate-400">There are no manually recorded open positions.</p><button type="button" onClick={() => navigate("checks")} className="mt-4 rounded bg-slate-700 px-4 py-2.5 font-semibold hover:bg-slate-600">Go to symbol checks</button></div> : <><div className="flex items-baseline gap-3"><h2 className="text-base font-bold uppercase tracking-widest text-slate-300">Open positions</h2><span className="text-slate-400">{sorted.length}</span></div>{sorted.map((p) => <PositionCard key={p.position_id} p={p} onClose={closePosition}/>)}</>}
            </section>
            <div className="space-y-4"><AddPositionForm onAdded={refresh}/><div data-disclaimer className="rounded-lg bg-slate-900/60 p-5 ring-1 ring-slate-700"><h2 className="text-base font-bold uppercase tracking-widest text-slate-300">Advisory only</h2><p className="mt-2 leading-relaxed text-slate-300">This system never places, modifies, or cancels an order. Every position action is manual in your broker app.</p></div></div>
          </div>
        </>}

        {activePage === "journal" && <JournalPanel positions={positions}/>}
        {activePage === "playbook" && <Playbook/>}
        {activePage === "checks" && <div className="grid items-start gap-4 xl:grid-cols-2"><div className="space-y-4"><CheckEntryPanel/><CheckAllPanel prominent onReady={(fn) => (runAllRef.current = fn)}/></div><CheckedLogPanel startedAt={healthStartedAt}/></div>}
        {activePage === "event-risk" && <EventRiskPanel er={snap && snap.event_risk}/>}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --strict-config
filterwarnings =
    error
    # The 2026 NSE holiday table is deliberately unverified and warns on use.
    # Tests assert this warning fires; it must not fail the suite.
    ignore:NSE holiday list.*UNVERIFIED:UserWarning
    # NOTE: uvicorn 0.34 emits three websockets deprecations when it serves a real
    # socket. They are NOT ignored here on purpose -- `error` should stay unqualified
    # for our own code. tests/test_web_render.py scopes the relaxation to its server
    # thread instead, so the strictness of the rest of the suite is untouched.
